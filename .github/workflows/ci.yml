name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_PUBLIC_FAIL_ON_MISSING_ENV: "false"
      # Smoke build uses harmless placeholders so the bundle can build without
      # exposing the real pilot keys to the workflow logs.
      Supabase_URL: "https://placeholder.supabase.co"
      Supabase_Publishable_Key: "sb_publishable_placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Build web bundle
        run: npm run build:web

      - name: Smoke test web bundle
        run: npm run smoke:web
