# Codemagic CI/CD — Spotter (Expo managed, iOS → TestFlight)
#
# This builds the native iOS app on Codemagic's macOS machines:
#   npm ci  →  expo prebuild (generates ios/)  →  CocoaPods  →  signed archive  →  TestFlight
#
# ───────────────────────────────────────────────────────────────────────────
# ONE-TIME SETUP IN THE CODEMAGIC UI (cannot be done from this repo):
#
# 1. App Store Connect API key (added in Codemagic as "AppStoreConnect")
#    Codemagic → User settings → Integrations → App Store Connect → Manage keys.
#    The Codemagic-side key name must match `integrations.app_store_connect` below.
#
# 2. Environment variable group "supabase" (Codemagic → Environment variables):
#    - Supabase_URL                 = https://<your-ref>.supabase.co
#    - Supabase_Publishable_Key     = sb_publishable_...
#    Add them to a group called "supabase" and mark the key as secure.
#
# 3. APP_STORE_APPLE_ID (in the "appstore" group): numeric Apple ID from
#    App Store Connect → App Information → "Apple ID" (auto-increments build #).
#
# Signing: this workflow fetches/creates the Distribution cert + App Store
# profile from Apple on each build (no manual upload). Optional later: add
# CERTIFICATE_PRIVATE_KEY to a "code-signing" group to reuse the same cert.
# ───────────────────────────────────────────────────────────────────────────

workflows:
  ios-testflight:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    integrations:
      app_store_connect: AppStoreConnect

    environment:
      groups:
        - supabase   # Supabase_URL, Supabase_Publishable_Key
        - appstore   # APP_STORE_APPLE_ID (numeric Apple app id)
        # Optional: code-signing group with CERTIFICATE_PRIVATE_KEY to reuse cert
      vars:
        XCODE_WORKSPACE: "Spotter.xcworkspace"
        XCODE_SCHEME: "Spotter"
        BUNDLE_ID: "com.spotter.dog"
        # Force the production guard in app.config.js so a build never ships
        # with placeholder Supabase config.
        EXPO_PUBLIC_FAIL_ON_MISSING_ENV: "true"
      node: 20
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Generate native iOS project (expo prebuild)
        script: npx expo prebuild --platform ios --clean

      - name: Set up keychain for code signing
        script: keychain initialize

      - name: Fetch or create Distribution cert and App Store profile
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Set up code signing on Xcode project
        script: xcode-project use-profiles

      - name: Set build number from latest TestFlight build
        script: |
          set -e
          cd ios
          if [ -n "$APP_STORE_APPLE_ID" ]; then
            LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "")
          else
            LATEST_BUILD_NUMBER=""
          fi
          if [ -z "$LATEST_BUILD_NUMBER" ]; then
            NEW_BUILD_NUMBER="$BUILD_NUMBER"
          else
            NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          fi
          echo "Setting iOS build number to $NEW_BUILD_NUMBER"
          agvtool new-version -all "$NEW_BUILD_NUMBER"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
